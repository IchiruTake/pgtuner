<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Test Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div class="max-w-7xl mx-auto">
    <!-- Header Section -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
        <div class="flex flex-col lg:flex-row gap-4 items-start lg:items-center justify-between">
            <!-- Generate Configuration Button -->
            <button class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg flex items-center gap-2 font-medium transition-colors w-full sm:w-auto">
                <i class="bi bi-gear-fill"></i>
                Generate Configuration
            </button>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                <button class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    <i class="bi bi-clipboard"></i>
                    <span class="text-sm">Copy to Clipboard</span>
                </button>
                <button class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    <i class="bi bi-download"></i>
                    <span class="text-sm">Download Report</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <!-- Memory Result Section -->
        <div class="xl:col-span-1">
            <div class="bg-white rounded-lg shadow-sm p-4 h-full">
                <h3 class="text-lg font-semibold mb-3 text-gray-800">Memory Result</h3>
                <div class="bg-gray-50 rounded-lg p-4 h-64 overflow-y-auto">
                    <p class="text-gray-600 text-sm">Memory Result Test is here...</p>
                </div>
            </div>
        </div>

        <!-- Response Section -->
        <div class="xl:col-span-1">
            <div class="bg-white rounded-lg shadow-sm p-4 h-full">
                <h3 class="text-lg font-semibold mb-3 text-gray-800">Response</h3>
                <div class="bg-gray-50 rounded-lg p-4 h-64 overflow-y-auto">
                    <p class="text-gray-600 text-sm">Response will appear here...</p>
                </div>
            </div>
        </div>

        <!-- RAM Column Section -->
        <div class="xl:col-span-1">
            <div class="bg-white rounded-lg shadow-sm p-4 h-full">
                <h3 class="text-lg font-semibold mb-3 text-gray-800 flex items-center gap-2">
                    <i class="bi bi-memory"></i>
                    RAM Monitor
                </h3>
                <div class="space-y-4">
                    <!-- RAM Usage Bar -->
                    <div class="bg-gray-200 rounded-full h-4 overflow-hidden">
                        <div class="bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 65%"></div>
                    </div>
                    <div class="text-sm text-gray-600">
                        <div class="flex justify-between">
                            <span>Used: 6.5 GB</span>
                            <span>Total: 10 GB</span>
                        </div>
                    </div>

                    <!-- Additional RAM Info -->
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span class="text-gray-600">Available:</span>
                            <span class="font-medium">3.5 GB</span>
                        </div>
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span class="text-gray-600">Usage:</span>
                            <span class="font-medium text-blue-600">65%</span>
                        </div>
                        <div class="flex justify-between py-2">
                            <span class="text-gray-600">Status:</span>
                            <span class="font-medium text-green-600">Normal</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile-friendly stacked layout for smaller screens -->
    <div class="block xl:hidden mt-6">
        <div class="bg-white rounded-lg shadow-sm p-4">
            <h3 class="text-lg font-semibold mb-3 text-gray-800">Quick Stats</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-center">
                <div class="bg-blue-50 rounded-lg p-3">
                    <i class="bi bi-cpu text-blue-600 text-xl mb-1"></i>
                    <div class="text-sm font-medium">CPU</div>
                    <div class="text-xs text-gray-600">45%</div>
                </div>
                <div class="bg-green-50 rounded-lg p-3">
                    <i class="bi bi-memory text-green-600 text-xl mb-1"></i>
                    <div class="text-sm font-medium">RAM</div>
                    <div class="text-xs text-gray-600">65%</div>
                </div>
                <div class="bg-purple-50 rounded-lg p-3 col-span-2 sm:col-span-1">
                    <i class="bi bi-hdd text-purple-600 text-xl mb-1"></i>
                    <div class="text-sm font-medium">Storage</div>
                    <div class="text-xs text-gray-600">78%</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
