<div class="mb-6 border-t border-gray-300 pt-2">
    <!-- Anti-wraparound Vacuum Tuning -->
    <div class="mb-6">
        <h3 class="text-2xl font-bold text-gray-800 mb-2 flex items-center">
            <i class="bi bi-pencil text-blue-600 mr-3"></i>
            Anti-wraparound Vacuum Tuning
        </h3>
        <p class="text-gray-600">These settings are used to estimate what is the optimized scenario to perform aggressive anti-wraparound vacuum.</p>
    </div>

    <!-- Details 1: Anti-wraparound Vacuum Tuning -->
    <div class="grid md:grid-cols-2 gap-6">
        <!-- Size of the Database in GiB -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3"  for="database_size_in_gib">
                Database Size (in GiB)
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="The total data size on server (in GiB). This value is used to estimate the maximum database size for anti-wraparound vacuum. If this field is zero, the assumption is about 60 % usage of the data volume. The supported range is [0, 32768], but its maximum threshold silently capped at 90% of the data volume." data-tooltip-header="Total data size (in GiB)">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="database_size_in_gib" id="database_size_in_gib_range" max="32768" min="0" step="1" value="20" type="range" onchange="syncSliderToNumber('database_size_in_gib')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>0 GiB</span>
                        <span>32768 GiB</span>
                    </div>
                </div>
                <input id="database_size_in_gib" max="32768" min="0" step="1" value="20" type="number" onchange="syncNumberToSlider('database_size_in_gib')" class="w-24 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- Number of Write Transactions per Hour on Workload on Server -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="num_write_transaction_per_hour_on_workload">
                Write Transactions/hour on Workload
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="The peak number of workload WRITE transaction per hour (including sub-transactions, accounting all attempts to make data changes (not SELECT) regardless of COMMIT and ROLLBACK). Note that this number requires you to have good estimation on how much your server can be handled during its busy workload and idle workload. It is best to collect your real-world data pattern before using this value." data-tooltip-header="Number of Write Transactions per Hour on Workload on Server">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="num_write_transaction_per_hour_on_workload" id="num_write_transaction_per_hour_on_workload_range" max="20000000" min="1000" step="1000" value="50000" type="range" onchange="syncSliderToNumber('num_write_transaction_per_hour_on_workload')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>1000 TR</span>
                        <span>20000000 TR</span>
                    </div>
                </div>
                <input id="num_write_transaction_per_hour_on_workload" max="20000000" min="1000" step="1000" value="50000" type="number" onchange="syncNumberToSlider('num_write_transaction_per_hour_on_workload')" class="w-28 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

    </div>
</div>
