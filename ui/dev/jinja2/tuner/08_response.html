<div class="max-w-7xl mx-auto">
    <!-- Header Section -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-6 border-gray-300 border">
        <div class="flex flex-col lg:flex-row gap-4 items-start lg:items-center justify-between">
            <!-- Generate Configuration Button -->
            <button class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg flex items-center gap-2 font-medium transition-colors w-full sm:w-auto" id="generate-config" type="button" onclick="submitConfiguration()">
                <i class="bi bi-gear-fill"></i>
                Generate Configuration
            </button>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                <button class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors" type="button" onclick="copyToClipboard()">
                    <i class="bi bi-clipboard"></i>
                    <span class="text-sm">Copy to Clipboard</span>
                </button>
                <button class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors" type="button" onclick="downloadResponse()">
                    <i class="bi bi-download"></i>
                    <span class="text-sm">Download Report</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 ">
        <!-- Memory Result Section -->
        <div class="xl:col-span-1">
            <div class="bg-white rounded-lg shadow-sm p-4 h-full border-gray-300 border">
                <h3 class="text-lg font-semibold mb-3 text-gray-800 ">Memory Result</h3>
                <textarea id="response-box" style="font-size: 13px" rows="32" readonly placeholder="Response will appear here..." class="bg-gray-50 rounded-lg p-4 h-64 overflow-y-auto w-full"></textarea>
            </div>
        </div>

        <!-- Response Section -->
        <div class="xl:col-span-1">
            <div class="bg-white rounded-lg shadow-sm p-4 h-full border-gray-300 border">
                <h3 class="text-lg font-semibold mb-3 text-gray-800">Response</h3>
                <textarea id="mem-report" style="font-size: 13px" rows="32" readonly placeholder="Response will appear here..." class="bg-gray-50 rounded-lg p-4 h-64 w-full"></textarea>
            </div>
        </div>
