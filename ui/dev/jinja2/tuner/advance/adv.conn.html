<div class="mb-6 pt-2">
    <!-- Title 1: Connection Control -->
    <div class="mb-6">
        <h3 class="text-2xl font-bold text-gray-800 mb-2 flex items-center">
            <i class="bi bi-modem text-blue-600 mr-3"></i>
            Connection Control
        </h3>
    </div>

    <!-- Details 1: Connection Control -->
    <div class="grid md:grid-cols-2 gap-8">
        <!-- user_max_connections -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="keywords.user_max_connections">
                Maximum Users Connections
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="The maximum number of client connections allowed (override by user). Unless necessary required to have large number of connections, it is best to use default and if the number of user connections exceed 75 then it is better to use connection pooling to minimize connection latency overhead and memory usage." data-tooltip-header="Maximum Number of Users Connections">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="keywords.user_max_connections" id="keywords.user_max_connections_range" max="1000" min="0" step="1" value="0" type="range" onchange="syncSliderToNumber('keywords.user_max_connections')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>0 Conn</span>
                        <span>1000 Conn</span>
                    </div>
                </div>
                <input id="keywords.user_max_connections" max="1000" min="0" step="1" value="0" type="number" onchange="syncNumberToSlider('keywords.user_max_connections')" class="w-24 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- cpu_to_connection_scale_ratio -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="keywords.cpu_to_connection_scale_ratio">
                CPU to Connection Scale Ratio
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="The scale factor to translate from number of logical CPUs to database connections to optimize IPC of CPU and reduce latency and overhead of context switches." data-tooltip-header="CPU to Connection Scale Ratio">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="keywords.cpu_to_connection_scale_ratio" id="keywords.cpu_to_connection_scale_ratio_range" max="10" min="2.5" step="0.5" value="5" type="range" onchange="syncSliderToNumber('keywords.cpu_to_connection_scale_ratio')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>2.5</span>
                        <span>10.0</span>
                    </div>
                </div>
                <input id="keywords.cpu_to_connection_scale_ratio" max="10" min="2.5" step="0.5" value="5" type="number" onchange="syncNumberToSlider('keywords.cpu_to_connection_scale_ratio')" class="w-24 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- cpu_to_parallel_scale_ratio -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="keywords.cpu_to_parallel_scale_ratio">
                CPU to Parallel Scale Ratio
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="" data-tooltip-header="CPU to Parallel Scale Ratio">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="keywords.cpu_to_parallel_scale_ratio" id="keywords.cpu_to_parallel_scale_ratio_range" max="3" min="1.5" step="0.25" value="2" type="range" onchange="syncSliderToNumber('keywords.cpu_to_parallel_scale_ratio')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>1.5</span>
                        <span>3</span>
                    </div>
                </div>
                <input id="keywords.cpu_to_parallel_scale_ratio" max="3" min="1.5" step="0.25" value="2" type="number" onchange="syncNumberToSlider('keywords.cpu_to_parallel_scale_ratio')" class="w-24 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- memory_connection_to_dedicated_os_ratio -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="keywords.memory_connection_to_dedicated_os_ratio">
                Connection: Memory on OS Ratio
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="The ratio of the memory connection reserved to the dedicated OS memory rather on shared_buffers from PostgreSQL memory." data-tooltip-header="Connection: Memory on OS Ratio">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="keywords.memory_connection_to_dedicated_os_ratio"
                           id="keywords.memory_connection_to_dedicated_os_ratio_range"
                           max="1" min="0" step="0.05" value="0.7" type="range"
                           onchange="syncSliderToNumber('keywords.memory_connection_to_dedicated_os_ratio')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>0</span>
                        <span>1</span>
                    </div>
                </div>
                <input id="keywords.memory_connection_to_dedicated_os_ratio" max="1" min="0" step="0.05" value="0.7" type="number" onchange="syncNumberToSlider('keywords.memory_connection_to_dedicated_os_ratio')" class="w-24 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- superuser_reserved_connections_scale_ratio -->
        <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="keywords.superuser_reserved_connections_scale_ratio">
                Superuser Reserved Connections Scale Ratio
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="The de-scale factor for the reserved superuser connections over the normal reserved connection. Higher value means less superuser reserved connection." data-tooltip-header="Superuser Reserved Connections Scale Ratio">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="keywords.superuser_reserved_connections_scale_ratio" id="keywords.superuser_reserved_connections_scale_ratio_range" max="3" min="1" step="0.25" value="1.5" type="range" onchange="syncSliderToNumber('keywords.superuser_reserved_connections_scale_ratio')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>1</span>
                        <span>3</span>
                    </div>
                </div>
                <input id="keywords.superuser_reserved_connections_scale_ratio" max="3" min="1" step="0.25" value="1.5" type="number" onchange="syncNumberToSlider('keywords.superuser_reserved_connections_scale_ratio')" class="w-24 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- single_memory_connection_overhead -->
        <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="keywords.single_memory_connection_overhead_in_kib">
                Total Memory Used per Connection (KiB)
                <button type="button" class="tooltip-trigger ml-2 text-blue-500 hover:text-blue-700" data-tooltip="The memory overhead for a single connection at idle state. This value is used to estimate the memory usage for each connection; and it is advised to not set it too high or change it as it could make the estimation to be incorrect (recommend to be between 4 - 8 MiB)." data-tooltip-header="Total Memory Used per Connection (KiB)">
                    <i class="bi bi-info-circle"></i>
                </button>
            </label>
            <div class="flex items-start space-x-4">
                <div class="flex-1 w-full">
                    <input name="keywords.single_memory_connection_overhead_in_kib"
                           id="keywords.single_memory_connection_overhead_in_kib_range"
                           max="12288" min="2048" step="512" value="5120" type="range"
                           onchange="syncSliderToNumber('keywords.single_memory_connection_overhead_in_kib')" class="w-full accent-blue-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>2048 KiB</span>
                        <span>12288 KiB</span>
                    </div>
                </div>
                <input id="keywords.single_memory_connection_overhead_in_kib" max="12288" min="2048" step="512" value="5120" type="number" onchange="syncNumberToSlider('keywords.single_memory_connection_overhead_in_kib')" class="w-24 px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>


    </div>

</div>
